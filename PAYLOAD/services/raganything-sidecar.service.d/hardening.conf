[Unit]
# A transient failure (e.g. a brief port conflict while another process holds
# 17321) must NOT permanently kill the service. On 2026-09-11 a SIGKILL
# followed by six EADDRINUSE restarts tripped the default rate limit
# (StartLimitBurst=5) and left the sidecar dead for 5.5h, which surfaced as the
# KB panel reading "未连接（演示数据）". 0 disables the rate limit so systemd
# keeps retrying forever; RestartSec=5 keeps the retry cadence gentle.
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=5
TimeoutStopSec=30
KillSignal=SIGTERM
